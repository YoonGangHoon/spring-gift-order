<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
  <meta charset="UTF-8">
  <title>회원 상세</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="container">
  <h1>회원 상세</h1>

  <p><strong>카카오 아이디:</strong> <span th:text="${member.kakaoId}">카카오 아이디</span></p>
  <p><strong>닉네임:</strong> <span th:text="${member.nickname()}">0</span></p>

  <div style="margin-top: 1.5rem;">
    <form th:action="@{/admin/members/{id}/delete(id=${member.id})}" method="post" style="display:inline">
      <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
    </form>
  </div>

  <div class="back-link">
    <a th:href="@{/admin/members}">← 목록으로</a>
  </div>
</div>
</body>
</html>
