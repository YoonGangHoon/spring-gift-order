<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
<head>
    <meta charset="UTF-8">
    <title>회원 목록</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>회원 목록</h1>

    <table>
        <thead>
        <tr>
            <th>카카오 아이디</th>
            <th>닉네임</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="member : ${members}">
            <td th:text="${member.kakaoId}">카카오 아이디</td>
            <td th:text="${member.nickname}">닉네임</td>
            <td>
                <a th:href="@{'/admin/members/' + ${member.id}}">상세</a>
                <form th:action="@{/admin/members/{id}/delete(id=${member.id})}" method="post" style="display:inline">
                    <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?')">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem;">
        <a href="/admin/dashboard" class="top-button">대시보드</a>
    </div>
</div>
</body>
</html>
